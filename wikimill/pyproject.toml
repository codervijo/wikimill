[project]
name = "wikimill"
version = "0.1.0"
description = "Local-first crawler for Wikipedia external links — dead, parked, and expired-domain discovery."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "tldextract>=5.1",  # v1.D — Public Suffix List (bundled snapshot; never fetched)
    "idna>=3.6",        # v1.D — UTS-46 host encoding (used directly, not transitively)
    "httpx>=0.27",      # v1.E — the crawler (hand-written client; MockTransport in tests)
    "dnspython>=2.6",   # v1.G — multi-resolver DNS (an NXDOMAIN needs corroboration)
    "mwparserfromhell>=0.6",  # v1.H — wikitext parsing, for the enriched subset only
]


[project.scripts]
wikimill = "wikimill.cli:main"

# uv installs dependency-groups by default on `uv sync` (so `make test` works).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikimill"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
